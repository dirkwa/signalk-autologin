name: Publish Package

# Tag glob is intentionally tight ('v[0-9]*.[0-9]*.[0-9]*') so stray
# tags like `vendor-fix` or `vnext` don't trigger a publish. Prerelease
# suffixes (-beta./-rc.) still match because the glob looks at the
# leading digits only; the publish step routes them to npm's `beta`
# dist-tag instead of `latest`.
#
# A real release's tag and GitHub Release are both created by
# release-please, which then dispatches this workflow on the tag — a tag
# pushed with GITHUB_TOKEN starts no workflow, and npm's trusted publishing
# is bound to this filename, so the dispatch is how publishing happens.
# workflow_dispatch is therefore required, not a convenience.
#
# Only a hand-pushed pre-release tag still needs a Release made here, and
# it is created after a successful npm publish (`needs: publish`) so a
# failed build never leaves an orphaned Release with no installable
# package.

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

jobs:
  publish:
    # A dispatch can name any ref; only a release tag is published. The
    # semver step below is what rejects a malformed tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read

    steps:
      # The trigger glob already filters out non-semver-shaped tags, but
      # it accepts loose forms like `v01.0.0` (leading zeros) or
      # `v1.0.0.0` (four segments). Reject those before doing anything
      # publishable so a malformed tag never produces a publish.
      - name: Validate tag is semver
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} is not a valid semver vX.Y.Z[-prerelease][+build]"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Clean workspace
        run: git clean -xfd

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Any tag carrying a semver pre-release part (the `-…` before an
      # optional `+build`) goes to the `beta` dist-tag, not just -beta./-rc.
      # Enumerating identifiers would send an unlisted one such as
      # `-alpha.1` to `latest`, where a plain `npm install` would hand it to
      # every user as the current release.
      - name: Publish
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "${REF#refs/tags/}" =~ ^v[^+-]+- ]]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi

  release:
    # release-please creates the GitHub Release for a real version, so only
    # a hand-pushed pre-release tag needs one made here; running for every
    # tag would collide with the Release that already exists. A stable tag
    # has no `-`, so the test matches exactly the tags publish sends to the
    # `beta` dist-tag.
    needs: publish
    if: ${{ contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta.') || contains(github.ref_name, '-rc.') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
